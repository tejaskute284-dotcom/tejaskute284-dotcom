<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17191D" />
      <stop offset="50%" stop-color="#202124" />
      <stop offset="100%" stop-color="#131417" />
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB3" />
      <stop offset="50%" stop-color="#D6B878" />
      <stop offset="100%" stop-color="#A68748" />
    </linearGradient>

    <!-- Muted Silver Gradient -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFD6E1" />
      <stop offset="50%" stop-color="#A7B0BE" />
      <stop offset="100%" stop-color="#737D8D" />
    </linearGradient>

    <!-- Radial Glows for Sophisticated Metallic Lighting -->
    <radialGradient id="gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6B878" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#D6B878" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="silver-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7B0BE" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#A7B0BE" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A7B0BE" stroke-width="0.75" stroke-opacity="0.10" />
      <circle cx="40" cy="40" r="1" fill="#D6B878" fill-opacity="0.25" />
    </pattern>

    <style>
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: 7px;
        fill: #F5F3ED;
      }
      .hero-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 5px;
        fill: #A7B0BE;
      }
      .hero-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 2.5px;
        fill: #D6B878;
      }
      .mono-meta {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        fill: #A7B0BE;
        opacity: 0.75;
      }
      @keyframes goldPulse {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.9; }
        50% { stroke-dashoffset: 40; opacity: 0.45; }
      }
      @keyframes floatRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatRev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes coreBreathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .line-anim {
        stroke-dasharray: 200;
        animation: goldPulse 6s ease-in-out infinite;
      }
      .ring-1 {
        transform-origin: 970px 200px;
        animation: floatRing 24s linear infinite;
      }
      .ring-2 {
        transform-origin: 970px 200px;
        animation: floatRev 18s linear infinite;
      }
      .ring-3 {
        transform-origin: 970px 200px;
        animation: floatRing 30s linear infinite;
      }
      .core-element {
        transform-origin: 970px 200px;
        animation: coreBreathe 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#hero-bg)" />
  <rect width="100%" height="100%" fill="url(#tech-grid)" />

  <!-- Ambient Lighting Nodes -->
  <circle cx="200" cy="100" r="280" fill="url(#gold-glow)" />
  <circle cx="970" cy="200" r="320" fill="url(#silver-glow)" />
  <circle cx="970" cy="200" r="180" fill="url(#gold-glow)" />

  <!-- Decorative Border Frame -->
  <rect x="25" y="25" width="1150" height="350" fill="none" stroke="#A7B0BE" stroke-width="1" stroke-opacity="0.2" rx="10" />
  <rect x="35" y="35" width="1130" height="330" fill="none" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.15" rx="6" />

  <!-- Corner Brackets -->
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#D6B878" stroke-width="2.5" />
  <path d="M 1175 55 L 1175 25 L 1145 25" fill="none" stroke="#D6B878" stroke-width="2.5" />
  <path d="M 25 345 L 25 375 L 55 375" fill="none" stroke="#A7B0BE" stroke-width="2.5" />
  <path d="M 1175 345 L 1175 375 L 1145 375" fill="none" stroke="#A7B0BE" stroke-width="2.5" />

  <!-- Left Header Identity Group -->
  <g transform="translate(85, 0)">
    <!-- Status Indicator Pill -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#17191D" stroke="#D6B878" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="14" r="4" fill="#D6B878">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" class="mono-meta" fill="#F5F3ED">IDENTITY // ATHARVA UNIVERSITY</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="172" class="hero-title">
      TEJAS <tspan fill="url(#gold-grad)">KUTE</tspan>
    </text>

    <!-- Animated Underline Bar -->
    <g transform="translate(0, 192)">
      <!-- Base Line -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#A7B0BE" stroke-width="1.5" stroke-opacity="0.25" />
      <!-- Animated Gold Accent Segment -->
      <line x1="0" y1="0" x2="220" y2="0" stroke="url(#gold-grad)" stroke-width="2.5" class="line-anim" />
      <circle cx="220" cy="0" r="3" fill="#D6B878" />
    </g>

    <!-- Subtitle: Pillars -->
    <text x="0" y="235" class="hero-subtitle">
      AI &amp; MACHINE LEARNING <tspan fill="#D6B878">|</tspan> FULL-STACK <tspan fill="#D6B878">|</tspan> CYBERSECURITY
    </text>

    <!-- Recruiter Statement -->
    <text x="0" y="272" class="hero-tagline">
      ENGINEERING RESILIENT, INTELLIGENT SYSTEMS &amp; ENTERPRISE SOFTWARE
    </text>

    <!-- Metadata Badges -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" class="mono-meta">SPEC: B.TECH (AIML)</text>
      <circle cx="145" cy="-3.5" r="2" fill="#D6B878" />
      <text x="160" y="0" class="mono-meta">EXP: AERUS INFOTECH</text>
      <circle cx="310" cy="-3.5" r="2" fill="#A7B0BE" />
      <text x="325" y="0" class="mono-meta">LAB: CONCPT LABS</text>
    </g>
  </g>

  <!-- Right Side: 3D-Inspired Computational Object Visual -->
  <g id="hero-orb">
    <!-- Ambient Orbital Aura -->
    <ellipse cx="970" cy="200" rx="145" ry="55" fill="none" stroke="url(#silver-grad)" stroke-width="1" stroke-opacity="0.35" class="ring-1" />
    <ellipse cx="970" cy="200" rx="135" ry="95" fill="none" stroke="url(#gold-grad)" stroke-width="1.2" stroke-opacity="0.45" class="ring-2" stroke-dasharray="12 8" />
    <ellipse cx="970" cy="200" rx="110" ry="120" fill="none" stroke="url(#silver-grad)" stroke-width="1" stroke-opacity="0.3" class="ring-3" />

    <!-- Isometric Computational Grid Plate -->
    <g transform="translate(970, 200) scale(1, 0.58) rotate(45)">
      <rect x="-70" y="-70" width="140" height="140" fill="#17191D" stroke="#D6B878" stroke-width="1.5" stroke-opacity="0.5" rx="8" />
      <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#A7B0BE" stroke-width="1" stroke-opacity="0.4" />
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#D6B878" stroke-width="0.8" stroke-opacity="0.35" />
      <line x1="0" y1="-70" x2="0" y2="70" stroke="#D6B878" stroke-width="0.8" stroke-opacity="0.35" />
    </g>

    <!-- Central Core Node -->
    <g class="core-element">
      <circle cx="970" cy="200" r="32" fill="#17191D" stroke="url(#gold-grad)" stroke-width="2.5" />
      <circle cx="970" cy="200" r="18" fill="url(#gold-grad)" opacity="0.85" />
      <circle cx="970" cy="200" r="8" fill="#F5F3ED" />
      <!-- Core Inner Crosshair -->
      <line x1="970" y1="175" x2="970" y2="225" stroke="#17191D" stroke-width="1.5" />
      <line x1="945" y1="200" x2="995" y2="200" stroke="#17191D" stroke-width="1.5" />
    </g>

    <!-- Orbiting Satellite Data Nodes -->
    <circle cx="850" cy="165" r="4" fill="#D6B878">
      <animate attributeName="cy" values="165;155;165" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1085" cy="225" r="3.5" fill="#A7B0BE">
      <animate attributeName="cy" values="225;235;225" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="95" r="3" fill="#D6B878">
      <animate attributeName="cx" values="940;950;940" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1010" cy="305" r="2.5" fill="#A7B0BE">
      <animate attributeName="cx" values="1010;1000;1010" dur="4.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Technical Telemetry Stamp -->
  <g transform="translate(1085, 340)">
    <text x="0" y="0" class="mono-meta" text-anchor="end" fill="#A7B0BE">SYS_REV // 2026.4</text>
    <text x="0" y="14" class="mono-meta" text-anchor="end" fill="#D6B878">PALETTE: GOLD/SILVER</text>
  </g>
</svg>