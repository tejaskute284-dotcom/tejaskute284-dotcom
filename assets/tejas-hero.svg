<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17191D" />
      <stop offset="50%" stop-color="#202124" />
      <stop offset="100%" stop-color="#131417" />
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4BE" />
      <stop offset="45%" stop-color="#D6B878" />
      <stop offset="100%" stop-color="#9C7E3E" />
    </linearGradient>

    <!-- Champagne Gold Metallic Shimmer -->
    <linearGradient id="gold-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C7E3E" />
      <stop offset="35%" stop-color="#D6B878" />
      <stop offset="50%" stop-color="#FFF3D6" />
      <stop offset="65%" stop-color="#D6B878" />
      <stop offset="100%" stop-color="#9C7E3E" />
    </linearGradient>

    <!-- Muted Silver Gradient -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E7EE" />
      <stop offset="50%" stop-color="#A7B0BE" />
      <stop offset="100%" stop-color="#6E7786" />
    </linearGradient>

    <!-- Muted Silver Metallic Shimmer -->
    <linearGradient id="silver-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E7786" />
      <stop offset="30%" stop-color="#A7B0BE" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#A7B0BE" />
      <stop offset="100%" stop-color="#6E7786" />
    </linearGradient>

    <!-- 3D Neural Sphere Shading (Graphite/Silver/Gold) -->
    <radialGradient id="sphere-3d" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="12%" stop-color="#F2DFC0" stop-opacity="0.8" />
      <stop offset="28%" stop-color="#D6B878" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#3D3A34" />
      <stop offset="85%" stop-color="#1C1D21" />
      <stop offset="100%" stop-color="#121316" />
    </radialGradient>

    <!-- Illuminated Central Nucleus -->
    <radialGradient id="nucleus-glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FDF3DA" />
      <stop offset="65%" stop-color="#D6B878" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D6B878" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Lighting Glows -->
    <radialGradient id="gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6B878" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#D6B878" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#D6B878" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="silver-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7B0BE" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#A7B0BE" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#A7B0BE" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A7B0BE" stroke-width="0.75" stroke-opacity="0.10" />
      <circle cx="40" cy="40" r="1" fill="#D6B878" fill-opacity="0.25" />
    </pattern>

    <style>
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: 7px;
        fill: #F5F3ED;
      }
      .hero-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 5px;
        fill: #A7B0BE;
      }
      .hero-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 2.5px;
        fill: #D6B878;
      }
      .mono-meta {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        fill: #A7B0BE;
        opacity: 0.75;
      }
      @keyframes goldPulse {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.9; }
        50% { stroke-dashoffset: 40; opacity: 0.45; }
      }
      .line-anim {
        stroke-dasharray: 200;
        animation: goldPulse 6s ease-in-out infinite;
      }

      /* ================= 3D QUANTUM GYROSCOPE ANIMATIONS ================= */
      @keyframes gyroFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-9px) rotate(1.5deg); }
      }
      @keyframes ringSpin1 {
        0% { transform: rotate(0deg) scale(1, 0.42); }
        100% { transform: rotate(360deg) scale(1, 0.42); }
      }
      @keyframes ringSpin2 {
        0% { transform: rotate(360deg) scale(1, 0.58) rotate(55deg); }
        100% { transform: rotate(0deg) scale(1, 0.58) rotate(55deg); }
      }
      @keyframes ringSpin3 {
        0% { transform: rotate(0deg) scale(1, 0.50) rotate(-50deg); }
        100% { transform: rotate(360deg) scale(1, 0.50) rotate(-50deg); }
      }
      @keyframes coreRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes nucleusPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      @keyframes nodeOrbit1 {
        0% { transform: rotate(0deg) translateX(148px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(148px) rotate(-360deg); }
      }
      @keyframes nodeOrbit2 {
        0% { transform: rotate(360deg) translateX(126px) rotate(-360deg); }
        100% { transform: rotate(0deg) translateX(126px) rotate(360deg); }
      }
      @keyframes nodeOrbit3 {
        0% { transform: rotate(0deg) translateX(105px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(105px) rotate(-360deg); }
      }

      .gyro-assembly {
        transform-origin: 970px 200px;
        animation: gyroFloat 7s ease-in-out infinite;
      }
      .gyro-ring-1 {
        transform-origin: 970px 200px;
        animation: ringSpin1 26s linear infinite;
      }
      .gyro-ring-2 {
        transform-origin: 970px 200px;
        animation: ringSpin2 20s linear infinite;
      }
      .gyro-ring-3 {
        transform-origin: 970px 200px;
        animation: ringSpin3 17s linear infinite;
      }
      .quantum-core-circuits {
        transform-origin: 970px 200px;
        animation: coreRotate 38s linear infinite;
      }
      .nucleus-glow-core {
        transform-origin: 970px 200px;
        animation: nucleusPulse 4.2s ease-in-out infinite;
      }
      .quantum-node-1 {
        transform-origin: 970px 200px;
        animation: nodeOrbit1 14s linear infinite;
      }
      .quantum-node-2 {
        transform-origin: 970px 200px;
        animation: nodeOrbit2 11s linear infinite;
      }
      .quantum-node-3 {
        transform-origin: 970px 200px;
        animation: nodeOrbit3 8.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#hero-bg)" />
  <rect width="100%" height="100%" fill="url(#tech-grid)" />

  <!-- Ambient Lighting Nodes -->
  <circle cx="200" cy="100" r="280" fill="url(#gold-glow)" />
  <circle cx="970" cy="200" r="320" fill="url(#silver-glow)" />
  <circle cx="970" cy="200" r="210" fill="url(#gold-glow)" />

  <!-- Decorative Border Frame -->
  <rect x="25" y="25" width="1150" height="350" fill="none" stroke="#A7B0BE" stroke-width="1" stroke-opacity="0.2" rx="10" />
  <rect x="35" y="35" width="1130" height="330" fill="none" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.15" rx="6" />

  <!-- Corner Brackets -->
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#D6B878" stroke-width="2.5" />
  <path d="M 1175 55 L 1175 25 L 1145 25" fill="none" stroke="#D6B878" stroke-width="2.5" />
  <path d="M 25 345 L 25 375 L 55 375" fill="none" stroke="#A7B0BE" stroke-width="2.5" />
  <path d="M 1175 345 L 1175 375 L 1145 375" fill="none" stroke="#A7B0BE" stroke-width="2.5" />

  <!-- Left Header Identity Group -->
  <g transform="translate(85, 0)">
    <!-- Status Indicator Pill -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#17191D" stroke="#D6B878" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="14" r="4" fill="#D6B878">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" class="mono-meta" fill="#F5F3ED">IDENTITY // ATHARVA UNIVERSITY</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="172" class="hero-title">
      TEJAS <tspan fill="url(#gold-grad)">KUTE</tspan>
    </text>

    <!-- Animated Underline Bar -->
    <g transform="translate(0, 192)">
      <!-- Base Line -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#A7B0BE" stroke-width="1.5" stroke-opacity="0.25" />
      <!-- Animated Gold Accent Segment -->
      <line x1="0" y1="0" x2="220" y2="0" stroke="url(#gold-grad)" stroke-width="2.5" class="line-anim" />
      <circle cx="220" cy="0" r="3" fill="#D6B878" />
    </g>

    <!-- Subtitle: Pillars -->
    <text x="0" y="235" class="hero-subtitle">
      AI &amp; MACHINE LEARNING <tspan fill="#D6B878">|</tspan> FULL-STACK <tspan fill="#D6B878">|</tspan> CYBERSECURITY
    </text>

    <!-- Recruiter Statement -->
    <text x="0" y="272" class="hero-tagline">
      ENGINEERING RESILIENT, INTELLIGENT SYSTEMS &amp; ENTERPRISE SOFTWARE
    </text>

    <!-- Metadata Badges -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" class="mono-meta">SPEC: B.TECH (AIML)</text>
      <circle cx="145" cy="-3.5" r="2" fill="#D6B878" />
      <text x="160" y="0" class="mono-meta">EXP: AERUS INFOTECH</text>
      <circle cx="310" cy="-3.5" r="2" fill="#A7B0BE" />
      <text x="325" y="0" class="mono-meta">LAB: CONCPT LABS</text>
    </g>
  </g>

  <!-- ================= RIGHT SIDE: 3D NEURAL QUANTUM GYROSCOPE ================= -->
  <g id="hero-gyroscope" class="gyro-assembly">

    <!-- Outermost Stator Ring Horizon with Calibration Notches -->
    <g>
      <circle cx="970" cy="200" r="162" fill="none" stroke="#A7B0BE" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3 8" />
      <circle cx="970" cy="200" r="168" fill="none" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.20" />
      <!-- 4 Cardinal Gold Calibration Pointers -->
      <line x1="970" y1="30" x2="970" y2="40" stroke="#D6B878" stroke-width="2" />
      <line x1="970" y1="360" x2="970" y2="370" stroke="#D6B878" stroke-width="2" />
      <line x1="800" y1="200" x2="810" y2="200" stroke="#A7B0BE" stroke-width="2" />
      <line x1="1130" y1="200" x2="1140" y2="200" stroke="#A7B0BE" stroke-width="2" />
    </g>

    <!-- PRIMARY GYROSCOPIC GIMBAL 1: Outer Champagne Gold Equatorial Track -->
    <g class="gyro-ring-1">
      <!-- 3D Beveled Outer Ring -->
      <ellipse cx="970" cy="200" rx="148" ry="148" fill="none" stroke="url(#gold-shimmer)" stroke-width="3.2" stroke-opacity="0.9" />
      <ellipse cx="970" cy="200" rx="142" ry="142" fill="none" stroke="#17191D" stroke-width="1" />
      <ellipse cx="970" cy="200" rx="154" ry="154" fill="none" stroke="url(#gold-grad)" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="16 12" />
      <!-- Gimbal Pivot Nodes -->
      <circle cx="822" cy="200" r="4.5" fill="#F5E4BE" stroke="#17191D" stroke-width="1.5" />
      <circle cx="1118" cy="200" r="4.5" fill="#F5E4BE" stroke="#17191D" stroke-width="1.5" />
    </g>

    <!-- SECONDARY GYROSCOPIC GIMBAL 2: Interlocking Muted Silver Inclined Ring (55 deg) -->
    <g class="gyro-ring-2">
      <!-- 3D Layered Elliptical Track -->
      <ellipse cx="970" cy="200" rx="126" ry="126" fill="none" stroke="url(#silver-shimmer)" stroke-width="2.6" stroke-opacity="0.85" />
      <ellipse cx="970" cy="200" rx="121" ry="121" fill="none" stroke="#202124" stroke-width="1" />
      <ellipse cx="970" cy="200" rx="131" ry="131" fill="none" stroke="#A7B0BE" stroke-width="0.75" stroke-opacity="0.45" stroke-dasharray="8 6" />
      <!-- Silver Pivot Nodes -->
      <circle cx="844" cy="200" r="4" fill="#FFFFFF" stroke="#17191D" stroke-width="1.5" />
      <circle cx="1096" cy="200" r="4" fill="#FFFFFF" stroke="#17191D" stroke-width="1.5" />
    </g>

    <!-- TERTIARY GYROSCOPIC GIMBAL 3: Inner Dual-Metallic Quantum Core Orbit (-50 deg) -->
    <g class="gyro-ring-3">
      <!-- 3D Inner Fine Track -->
      <ellipse cx="970" cy="200" rx="105" ry="105" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.8" />
      <ellipse cx="970" cy="200" rx="98" ry="98" fill="none" stroke="url(#silver-grad)" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="5 5" />
      <!-- Core Anchor Pivots -->
      <circle cx="865" cy="200" r="3.5" fill="#F5E4BE" />
      <circle cx="1075" cy="200" r="3.5" fill="#F5E4BE" />
    </g>

    <!-- Travelling Quantum Satellite Nodes (Precise Precession) -->
    <g class="quantum-node-1">
      <circle cx="970" cy="200" r="5" fill="#FFF3D6" stroke="#9C7E3E" stroke-width="1.5" />
      <circle cx="970" cy="200" r="2" fill="#FFFFFF" />
    </g>
    <g class="quantum-node-2">
      <circle cx="970" cy="200" r="4" fill="#FFFFFF" stroke="#6E7786" stroke-width="1.2" />
      <circle cx="970" cy="200" r="1.5" fill="#D6B878" />
    </g>
    <g class="quantum-node-3">
      <circle cx="970" cy="200" r="3.5" fill="#F5E4BE" stroke="#17191D" stroke-width="1" />
    </g>

    <!-- INTERIOR 3D NEURAL QUANTUM PROCESSOR SPHERE -->
    <g>
      <!-- Deep Radial Shadow Base for Floating Elevation -->
      <ellipse cx="970" cy="235" rx="55" ry="16" fill="#111215" opacity="0.75" />

      <!-- Primary 3D Metallic Sphere Shading -->
      <circle cx="970" cy="200" r="58" fill="url(#sphere-3d)" stroke="url(#gold-shimmer)" stroke-width="1.6" />

      <!-- Specular Highlight Sheen Arc -->
      <path d="M 940 162 A 54 54 0 0 1 988 152" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
      <path d="M 946 168 A 48 48 0 0 1 980 160" fill="none" stroke="#FFF3D6" stroke-width="1" stroke-linecap="round" opacity="0.45" />

      <!-- Rotating Circuit Geometries on Sphere Surface -->
      <g class="quantum-core-circuits">
        <!-- Neural Latitude & Longitude Quantum Rings -->
        <ellipse cx="970" cy="200" rx="52" ry="18" fill="none" stroke="#D6B878" stroke-width="0.9" stroke-opacity="0.7" stroke-dasharray="14 6" />
        <ellipse cx="970" cy="200" rx="18" ry="52" fill="none" stroke="#A7B0BE" stroke-width="0.9" stroke-opacity="0.6" stroke-dasharray="12 5" />
        <ellipse cx="970" cy="200" rx="42" ry="42" fill="none" stroke="#D6B878" stroke-width="0.5" stroke-opacity="0.35" stroke-dasharray="4 8" />

        <!-- Radial Bus Traces -->
        <line x1="970" y1="145" x2="970" y2="165" stroke="url(#gold-grad)" stroke-width="1.2" />
        <line x1="970" y1="235" x2="970" y2="255" stroke="url(#gold-grad)" stroke-width="1.2" />
        <line x1="915" y1="200" x2="935" y2="200" stroke="#A7B0BE" stroke-width="1.2" />
        <line x1="1005" y1="200" x2="1025" y2="200" stroke="#A7B0BE" stroke-width="1.2" />
        <circle cx="970" cy="165" r="2" fill="#D6B878" />
        <circle cx="970" cy="235" r="2" fill="#D6B878" />
        <circle cx="935" cy="200" r="2" fill="#A7B0BE" />
        <circle cx="1005" cy="200" r="2" fill="#A7B0BE" />
      </g>

      <!-- Central Illuminated Quantum Nucleus -->
      <circle cx="970" cy="200" r="22" fill="#17191D" stroke="url(#gold-grad)" stroke-width="1.5" />
      <circle cx="970" cy="200" r="16" fill="url(#nucleus-glow)" class="nucleus-glow-core" />
      <circle cx="970" cy="200" r="7" fill="#FFFFFF" />

      <!-- Precision Optical Reticle -->
      <line x1="970" y1="188" x2="970" y2="212" stroke="#17191D" stroke-width="1.2" stroke-linecap="round" />
      <line x1="958" y1="200" x2="982" y2="200" stroke="#17191D" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Technical Telemetry Stamp -->
  <g transform="translate(1085, 340)">
    <text x="0" y="0" class="mono-meta" text-anchor="end" fill="#A7B0BE">QUANTUM_REV // 2026.5</text>
    <text x="0" y="14" class="mono-meta" text-anchor="end" fill="#D6B878">3D NEURAL GYROSCOPE</text>
  </g>
</svg>