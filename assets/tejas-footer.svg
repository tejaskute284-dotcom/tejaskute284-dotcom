<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17191D" />
      <stop offset="50%" stop-color="#202124" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>

    <!-- Gold Accent Line Gradient -->
    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6B878" stop-opacity="0" />
      <stop offset="25%" stop-color="#D6B878" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#F2DFB3" stop-opacity="1" />
      <stop offset="75%" stop-color="#D6B878" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D6B878" stop-opacity="0" />
    </linearGradient>

    <!-- Silver Line Gradient -->
    <linearGradient id="silver-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7B0BE" stop-opacity="0" />
      <stop offset="50%" stop-color="#A7B0BE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A7B0BE" stop-opacity="0" />
    </linearGradient>

    <pattern id="footer-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#A7B0BE" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <style>
      .footer-name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 4px;
        fill: #F5F3ED;
      }
      .footer-statement {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 2px;
        fill: #A7B0BE;
      }
      .footer-code {
        font-family: "SFMono-Regular", Consolas, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 1.5px;
        fill: #D6B878;
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.95; }
      }
      .footer-pulse {
        animation: pulseLight 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#footer-bg)" rx="8" />
  <rect width="100%" height="100%" fill="url(#footer-grid)" rx="8" />

  <!-- Top Accent Rule -->
  <line x1="100" y1="12" x2="1100" y2="12" stroke="url(#gold-line)" stroke-width="1.8" />
  <line x1="250" y1="16" x2="950" y2="16" stroke="url(#silver-line)" stroke-width="1" />

  <!-- Center Diamond Emblem -->
  <g transform="translate(600, 12)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#D6B878" class="footer-pulse" />
    <circle cx="0" cy="0" r="1.5" fill="#17191D" />
  </g>

  <!-- Left Side: Identity -->
  <g transform="translate(70, 75)">
    <text x="0" y="0" class="footer-name">TEJAS <tspan fill="#D6B878">KUTE</tspan></text>
    <text x="0" y="24" class="footer-statement">ENGINEERING THE INTERSECTION OF INTELLIGENCE, SYSTEMS &amp; SECURITY</text>
  </g>

  <!-- Right Side: Details -->
  <g transform="translate(1130, 75)">
    <text x="0" y="0" class="footer-code" text-anchor="end">ATHARVA UNIVERSITY // MUMBAI</text>
    <text x="0" y="22" class="footer-statement" text-anchor="end">DESIGNED WITH CHAMPAGNE GOLD &amp; MUTED SILVER</text>
  </g>

  <!-- Minimal Decorative Geometric Node Lines -->
  <circle cx="80" cy="125" r="2" fill="#D6B878" />
  <line x1="90" y1="125" x2="180" y2="125" stroke="#A7B0BE" stroke-width="0.75" stroke-opacity="0.3" />
  <circle cx="1120" cy="125" r="2" fill="#A7B0BE" />
  <line x1="1020" y1="125" x2="1110" y2="125" stroke="#D6B878" stroke-width="0.75" stroke-opacity="0.4" />
</svg>